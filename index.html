<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>League of Nations</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Cpath d='M16 42V18h8v17h24v7H16Z' fill='%232dd4bf'/%3E%3Cpath d='M30 18h18v7H38v17h-8V18Z' fill='%23fbbf24'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="mode-screen" class="setup-screen">
    <section class="setup-panel mode-panel" aria-labelledby="mode-title">
      <div id="mode-title" class="setup-title">League of Nations</div>
      <div class="setup-subtitle">Choose a ruleset before opening match settings.</div>
      <div class="mode-grid">
        <button id="mode-lite-btn" type="button" class="mode-card primary-btn">
          <strong>Lite</strong>
          <span>Current simple flow and current gameplay rules.</span>
        </button>
        <button id="mode-advanced-btn" type="button" class="mode-card secondary-btn">
          <strong>Advanced</strong>
          <span>New terrain resources, gated construction, and advanced units.</span>
        </button>
        <button id="mode-scenario-btn" type="button" class="mode-card tertiary-btn">
          <strong>Scenario</strong>
          <span>Pre-designed maps and objectives with advanced rules.</span>
        </button>
      </div>
    </section>
  </div>

  <div id="scenario-screen" class="setup-screen" hidden>
    <section class="setup-panel" aria-labelledby="scenario-title">
      <div class="setup-head">
        <div>
          <div id="scenario-title" class="setup-title">Choose a Scenario</div>
          <div class="setup-subtitle">Select a scenario with pre-designed map and objectives.</div>
        </div>
        <button id="scenario-back-btn" type="button" class="secondary-btn">Back</button>
      </div>
      <div id="scenario-grid" class="scenario-grid"></div>
    </section>
  </div>

  <div id="setup-screen" class="setup-screen" hidden>
    <form id="setup-form" class="setup-panel">
      <div class="setup-head">
        <div>
          <div class="setup-title">League of Nations</div>
          <div id="setup-subtitle" class="setup-subtitle">Educational turn-based strategy</div>
        </div>
        <button id="back-to-mode-btn" type="button" class="secondary-btn">Back</button>
      </div>
      <div class="setup-grid">
        <label class="field">
          <span>Nation name</span>
          <input id="setup-player-name" type="text" maxlength="40" value="Republic of Nova" />
        </label>
        <label class="field">
          <span>Map size</span>
	          <select id="setup-map-size">
	            <option>Small</option>
	            <option selected>Medium</option>
	            <option>Large</option>
	            <option>Extra Large</option>
	            <option>Enormous</option>
	          </select>
	        </label>
	        <label class="field">
	          <span>Total nations</span>
	          <input id="setup-nation-count" type="number" min="2" max="16" step="1" value="5" />
	        </label>
        <label class="field">
          <span>Water coverage</span>
          <select id="setup-water-level">
            <option value="Low">More Land</option>
            <option value="Balanced" selected>Balanced</option>
            <option value="High">More Water</option>
          </select>
        </label>
        <label class="field">
          <span>Landscape diversity</span>
          <select id="setup-landscape-diversity">
            <option value="Low">Low</option>
            <option value="Balanced" selected>Balanced</option>
            <option value="High">High</option>
          </select>
        </label>
        <label class="field checkbox-field">
          <input id="setup-fog-of-war" type="checkbox" />
          <span>Fog of War</span>
        </label>
        <label class="field">
          <span>Max turns</span>
          <input id="setup-max-turns" type="number" min="10" max="120" step="1" value="30" />
        </label>
        <label class="field">
          <span>Minutes per turn</span>
          <input id="setup-turn-timer" type="number" min="0" max="240" step="1" value="0" />
        </label>
        <label class="field checkbox-field">
          <input id="setup-unlimited" type="checkbox" />
          <span>Unlimited mode</span>
        </label>
        <label class="field checkbox-field">
          <input id="setup-happiness-enabled" type="checkbox" checked />
          <span>Citizen happiness</span>
        </label>
      </div>
      <div id="continue-note" class="continue-note"></div>
      <div class="setup-actions">
        <button id="enter-code-btn" type="button" class="secondary-btn">Enter Code</button>
        <button id="create-match-btn" type="button" class="secondary-btn">Create Online Match</button>
        <button type="submit" class="primary-btn">Start Bot Match</button>
      </div>
      <div id="join-panel" class="join-panel" hidden>
        <label class="field">
          <span>Room code</span>
          <input id="join-room-code" type="text" maxlength="8" autocomplete="off" placeholder="ABCDE" />
        </label>
        <button id="join-match-btn" type="button" class="primary-btn">Join Match</button>
      </div>
      <div id="multiplayer-error" class="multiplayer-error" role="alert" hidden></div>
    </form>
  </div>

  <div id="lobby-screen" class="setup-screen" hidden>
    <section class="setup-panel lobby-panel" aria-labelledby="lobby-title">
      <div class="lobby-head">
        <div>
          <div id="lobby-title" class="setup-title">Lobby</div>
          <div id="lobby-subtitle" class="setup-subtitle">Room code <strong id="lobby-room-code">-----</strong></div>
        </div>
        <div class="lobby-head-actions">
          <button id="lobby-start-btn" type="button" class="primary-btn">Start Game</button>
          <button id="leave-lobby-btn" type="button" class="secondary-btn">Leave</button>
        </div>
      </div>

      <div class="lobby-layout">
        <section class="lobby-section">
          <h2>Players</h2>
          <div id="lobby-player-list" class="lobby-player-list"></div>
        </section>

        <section class="lobby-section">
          <h2>Game Settings</h2>
          <div class="setup-grid lobby-settings">
            <label class="field">
              <span>Map size</span>
	              <select id="lobby-map-size">
	                <option>Small</option>
	                <option>Medium</option>
	                <option>Large</option>
	                <option>Extra Large</option>
	                <option>Enormous</option>
	              </select>
	            </label>
	            <label class="field">
	              <span>Total nations</span>
	              <input id="lobby-nation-count" type="number" min="2" max="16" step="1" />
	            </label>
            <label class="field">
              <span>Water coverage</span>
              <select id="lobby-water-level">
                <option value="Low">More Land</option>
                <option value="Balanced">Balanced</option>
                <option value="High">More Water</option>
              </select>
            </label>
            <label class="field">
              <span>Landscape diversity</span>
              <select id="lobby-landscape-diversity">
                <option value="Low">Low</option>
                <option value="Balanced">Balanced</option>
                <option value="High">High</option>
              </select>
            </label>
            <label class="field checkbox-field">
              <input id="lobby-fog-of-war" type="checkbox" />
              <span>Fog of War</span>
            </label>
            <label class="field">
              <span>Max turns</span>
              <input id="lobby-max-turns" type="number" min="10" max="120" step="1" />
            </label>
            <label class="field">
              <span>Minutes per turn</span>
              <input id="lobby-turn-timer" type="number" min="0" max="240" step="1" />
            </label>
            <label class="field checkbox-field">
              <input id="lobby-unlimited" type="checkbox" />
              <span>Unlimited mode</span>
            </label>
            <label class="field checkbox-field">
              <input id="lobby-happiness-enabled" type="checkbox" />
              <span>Citizen happiness</span>
            </label>
          </div>
        </section>
      </div>

      <div id="lobby-status" class="continue-note"></div>
    </section>
  </div>

	  <div id="app" class="app" hidden>
	    <main class="game-shell">
	      <section class="map-section">
	        <header id="top-panel" class="topbar">
	          <button id="menu-toggle-btn" class="menu-toggle-btn" type="button" aria-label="Toggle menu" aria-expanded="false">
	            <span class="hamburger"><span></span><span></span><span></span></span>
	          </button>
	          <div class="brand-block">
	            <div class="brand">League of Nations</div>
	            <div id="phase-label" class="phase-label">Player Turn</div>
	          </div>
	          <div id="status-strip" class="status-strip"></div>
	          <div class="tool-dock" aria-label="Game tools">
	            <button id="action-counter" class="tool-circle action-counter" type="button" aria-label="Action points left" title="Action points left">3</button>
	            <button id="tech-tree-btn" class="tool-circle" type="button" aria-label="Tech tree" title="Tech Tree">
	              <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	                <path d="M12 3.5 7 9.25h2.5L5.5 14h4L7 18h4v3h2v-3h4l-2.5-4h4l-4-4.75H17L12 3.5Z" />
	              </svg>
	            </button>
	            <button id="replay-tutorial-btn" class="tool-circle" type="button" aria-label="Tutorial" title="Tutorial">?</button>
	            <button id="leaderboard-btn" class="tool-circle" type="button" aria-label="Leaderboard" title="Leaderboard">#</button>
	            <button id="board-society-btn" class="tool-circle" type="button" aria-label="Society" title="Society">S</button>
	            <button id="board-diplomacy-btn" class="tool-circle" type="button" aria-label="Diplomacy" title="Diplomacy">
	              <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	                <path d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19Zm0 2c.78 0 1.6 1.05 2.15 2.8h-4.3C10.4 5.55 11.22 4.5 12 4.5Zm-3.08 0.9a11.42 11.42 0 0 0-1.14 1.9H6.42a7.57 7.57 0 0 1 2.5-1.9Zm6.16 0a7.57 7.57 0 0 1 2.5 1.9h-1.36a11.42 11.42 0 0 0-1.14-1.9ZM5.36 9.3h1.79A13.7 13.7 0 0 0 7 12c0 .95.1 1.86.28 2.7H5.36a7.5 7.5 0 0 1 0-5.4Zm3.84 0h5.6c.2.82.3 1.74.3 2.7s-.1 1.88-.3 2.7H9.2A11.6 11.6 0 0 1 8.9 12c0-.96.1-1.88.3-2.7Zm7.65 0h1.79a7.5 7.5 0 0 1 0 5.4h-1.92c.18-.84.28-1.75.28-2.7 0-.95-.05-1.86-.15-2.7ZM6.42 16.7h1.36c.32.73.7 1.37 1.14 1.9a7.57 7.57 0 0 1-2.5-1.9Zm3.43 0h4.3c-.55 1.75-1.37 2.8-2.15 2.8s-1.6-1.05-2.15-2.8Zm6.37 0h1.36a7.57 7.57 0 0 1-2.5 1.9c.44-.53.82-1.17 1.14-1.9Z" />
	              </svg>
	            </button>
	            <button id="board-trade-btn" class="tool-circle" type="button" aria-label="Trade" title="Trade">$</button>
	            <button id="board-victory-btn" class="tool-circle" type="button" aria-label="Victory progress" title="Victory Progress" hidden>
	              <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	                <path d="M6 3.5a1 1 0 0 0-1 1v1A4.5 4.5 0 0 0 9.5 10h.21A4.98 4.98 0 0 0 11 12.33V15H8.75a1 1 0 0 0-.8.4l-1.5 2A1 1 0 0 0 7.25 19h9.5a1 1 0 0 0 .8-1.6l-1.5-2a1 1 0 0 0-.8-.4H13v-2.67A4.98 4.98 0 0 0 14.29 10h.21A4.5 4.5 0 0 0 19 5.5v-1a1 1 0 0 0-1-1h-2.48a1 1 0 0 0-.97.76A4.98 4.98 0 0 0 12 3a4.98 4.98 0 0 0-2.55 1.26 1 1 0 0 0-.97-.76H6Zm1 2h1.09A4.96 4.96 0 0 0 8.5 8H9.1A2.5 2.5 0 0 1 7 5.5Zm10 0a2.5 2.5 0 0 1-2.1 2.47h.6a4.96 4.96 0 0 0 .41-2.47H17ZM12 5a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z" />
	              </svg>
	            </button>
	          </div>
	          <div class="top-actions">
	            <button id="end-turn-btn" class="primary-btn">End Turn</button>
	          </div>
	          <div id="resource-panel" class="resource-strip" aria-label="Resources"></div>
	        </header>
	        <canvas id="map-canvas"></canvas>
          <button id="floating-end-turn-btn" class="floating-end-turn-btn primary-btn" type="button" hidden>End Turn</button>
	        <div id="tooltip" class="tooltip" hidden></div>
	        <div id="server-error-display" class="server-error-display" role="alert" hidden></div>
	        <section id="tile-popup" class="tile-popup" hidden>
	          <button id="tile-close-btn" class="icon-btn close-btn" aria-label="Close tile popup">×</button>
	          <div id="tile-popup-content"></div>
	        </section>
	        <section id="scenario-objectives-panel" class="scenario-objectives-panel" hidden>
	          <div class="scenario-objectives-head">
	            <h3 id="scenario-objectives-title">Objectives</h3>
	            <button id="scenario-objectives-close-btn" class="icon-btn close-btn" aria-label="Close objectives panel">×</button>
	          </div>
	          <div id="scenario-objectives-content" class="scenario-objectives-content"></div>
	        </section>
	      </section>
	    </main>
	  </div>

  <div id="dialog-backdrop" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button id="dialog-close-btn" class="icon-btn" aria-label="Close dialog">×</button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
    </div>
  </div>

  <!-- Audio elements for background and battle music -->
  <audio id="bg-music" preload="auto"></audio>
  <audio id="battle-music" preload="auto"></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- GLTFLoader attaches to window.THREE.GLTFLoader; required for the GLB asset pipeline. -->
  <!-- Safe to remove if you never use GLB models — procedural fallbacks work without it. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- SkeletonUtils enables safe cloning for future animated/skinned GLB assets. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
  <script src="https://unpkg.com/@colyseus/sdk@^0.17.0/dist/colyseus.js"></script>
  <script>
    // Local uses ws://localhost:2567; production uses wss://league-of-nations-production.up.railway.app.
    // Do not include :2567 in production because Railway maps the public domain to the internal PORT.
    window.COLYSEUS_ENDPOINT = window.COLYSEUS_ENDPOINT || "";
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
