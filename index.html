<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>League of Nations</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="setup-screen" class="setup-screen">
    <form id="setup-form" class="setup-panel">
      <div class="setup-title">League of Nations</div>
      <div class="setup-subtitle">Educational turn-based strategy</div>
      <div class="setup-grid">
        <label class="field">
          <span>Nation name</span>
          <input id="setup-player-name" type="text" maxlength="40" value="Republic of Nova" />
        </label>
        <label class="field">
          <span>Map size</span>
          <select id="setup-map-size">
            <option>Small</option>
            <option selected>Medium</option>
            <option>Large</option>
          </select>
        </label>
        <label class="field">
          <span>Total nations</span>
          <input id="setup-nation-count" type="number" min="2" max="10" step="1" value="5" />
        </label>
        <label class="field">
          <span>Max turns</span>
          <input id="setup-max-turns" type="number" min="10" max="120" step="1" value="30" />
        </label>
        <label class="field">
          <span>Time limit minutes</span>
          <input id="setup-time-limit" type="number" min="0" max="240" step="5" value="0" />
        </label>
        <label class="field checkbox-field">
          <input id="setup-unlimited" type="checkbox" />
          <span>Unlimited mode</span>
        </label>
      </div>
      <div id="continue-note" class="continue-note"></div>
      <div class="setup-actions">
        <button id="setup-replay-tutorial-btn" type="button" class="secondary-btn">Replay Tutorial</button>
        <button id="continue-btn" type="button" class="secondary-btn">Continue</button>
        <button type="submit" class="primary-btn">Start New Game</button>
      </div>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <header id="top-panel" class="topbar">
      <div class="brand-block">
        <div class="brand">League of Nations</div>
        <div id="phase-label" class="phase-label">Player Turn</div>
      </div>
      <div id="status-strip" class="status-strip"></div>
      <div id="action-counter" class="action-counter" aria-live="polite">Actions left: 10</div>
      <div class="top-actions">
        <button id="save-btn" class="secondary-btn">Save</button>
        <button id="new-game-btn" class="secondary-btn">New</button>
        <button id="replay-tutorial-btn" class="secondary-btn">Tutorial</button>
        <button id="end-turn-btn" class="primary-btn">End Turn</button>
      </div>
      <button id="top-collapse-btn" class="icon-btn panel-toggle top-toggle" type="button" aria-controls="top-panel" aria-expanded="true" aria-label="Collapse top panel">↑</button>
    </header>

    <main class="game-shell">
      <section class="map-section">
        <canvas id="map-canvas"></canvas>
        <div id="tooltip" class="tooltip" hidden></div>
        <section id="tile-popup" class="tile-popup" hidden>
          <button id="tile-close-btn" class="icon-btn close-btn" aria-label="Close tile popup">×</button>
          <div id="tile-popup-content"></div>
        </section>
      </section>

      <aside id="side-panel" class="side-panel">
        <button id="side-collapse-btn" class="icon-btn panel-toggle side-toggle" type="button" aria-controls="side-panel" aria-expanded="true" aria-label="Collapse side panel">→</button>
        <div class="side-panel-content">
          <details class="panel side-section" data-side-section="resources" open>
            <summary>Resources</summary>
            <div id="resource-panel"></div>
          </details>
          <details class="panel side-section" data-side-section="actions" open>
            <summary>Actions Remaining</summary>
            <div id="action-summary-panel"></div>
          </details>
          <details class="panel side-section" data-side-section="selection" open>
            <summary>Selected Tile</summary>
            <div id="selection-panel"></div>
          </details>
          <details class="panel side-section" data-side-section="nations">
            <summary>Other Nations</summary>
            <div id="nation-panel"></div>
          </details>
          <details class="panel side-section" data-side-section="diplomacy">
            <summary>Detailed Diplomacy</summary>
            <div id="diplomacy-panel"></div>
          </details>
          <details class="panel side-section" data-side-section="trade">
            <summary>Detailed Trade</summary>
            <div id="trade-panel"></div>
          </details>
          <details class="panel side-section" data-side-section="tech">
            <summary>Technology</summary>
            <div id="tech-panel"></div>
          </details>
          <details class="panel side-section" data-side-section="summary">
            <summary>Last Turn</summary>
            <div id="summary-panel"></div>
          </details>
        </div>
      </aside>
    </main>

    <footer id="bottom-panel" class="event-feed">
      <button id="bottom-collapse-btn" class="icon-btn panel-toggle bottom-toggle" type="button" aria-controls="bottom-panel" aria-expanded="true" aria-label="Collapse event feed">↓</button>
      <div class="feed-title">Event Feed</div>
      <div id="event-feed-content" class="feed-content"></div>
    </footer>
  </div>

  <div id="dialog-backdrop" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button id="dialog-close-btn" class="icon-btn" aria-label="Close dialog">×</button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
